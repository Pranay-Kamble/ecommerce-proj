syntax = "proto3";

package catalog;
option go_package = "ecommerce/pkg/protobufs/catalog";


service CatalogService {
  rpc CheckPrices(CheckPricesRequest) returns (CheckPricesResponse) {}
  rpc DecreaseInventory(DecreaseInventoryRequest) returns (DecreaseInventoryResponse) {}
}

message CheckPricesRequest {
  repeated string product_ids = 1;
}

message ProductCheck {
  string product_id = 1;
  double price = 2;
  bool is_available = 3;
}

message CheckPricesResponse {
  repeated ProductCheck products = 1;
}

message InventoryItem {
  string variant_id = 1;
  int32 quantity = 2;
}

message DecreaseInventoryRequest {
  repeated InventoryItem items = 1;
}

message DecreaseInventoryResponse {
  bool success = 1;
  string message = 2;
}